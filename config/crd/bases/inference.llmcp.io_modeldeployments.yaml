                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  extraArgs:
                    description: |-
                      ExtraArgs are appended verbatim to the engine's command line, after every
                      argument the profile generates.
                    items:
                      type: string
                    type: array
                  image:
                    description: |-
                      Image overrides the engine profile's default container image.

                      This is also the supported way to substitute a deterministic stub server
                      in tests and CI: the stub is selected here rather than through a
                      dedicated enum value, so the real profile's argument-building code path
                      is exercised rather than bypassed.
                    type: string
                  imagePullPolicy:
                    default: IfNotPresent
                    description: ImagePullPolicy for the engine image.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  maxConcurrency:
                    default: 4
                    description: |-
                      MaxConcurrency is how many requests the engine may process concurrently
                      (llama.cpp's --parallel).

                      It also determines when the engine starts queueing, which is the signal
                      autoscaling is driven from — so it is a capacity knob, not just a
                      performance one.
                    format: int32
                    minimum: 1
                    type: integer
                  resources:
                    description: |-
                      Resources are the engine container's compute resources. Setting a CPU
                      limit is strongly recommended: it is what Threads is derived from.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  threads:
                    description: |-
                      Threads is the engine's worker thread count (llama.cpp's -t).

                      When unset it is DERIVED from the container's CPU limit. This matters
                      more than it looks: llama.cpp reads the host's /proc and is unaware of
                      cgroup limits, so left alone every replica spawns one thread per host
                      core. Several replicas on one node then oversubscribe the CPU badly
                      enough that latency percentiles become noise — which in turn makes
                      metric-driven canary analysis produce false rollbacks.
                    format: int32
                    minimum: 1
                    type: integer
                  type:
                    default: llamacpp
                    description: Type selects the engine implementation.
                    enum:
                    - llamacpp
                    type: string
                type: object
              model:
                description: Model identifies what to serve and where its weights
                  come from.
                properties:
                  name:
                    description: |-
                      Name is the model identifier clients pass as "model" in OpenAI-compatible
                      requests, echoed at GET /v1/models. It is also the `model` label on every
                      metric this project emits, so keep it stable and low-cardinality.
                    maxLength: 253
                    minLength: 1
                    type: string
                  source:
                    description: Source is where the model weights come from.
                    properties:
                      huggingFace:
                        description: |-
                          HuggingFace downloads weights from the Hugging Face Hub at pod start.

                          Convenient, but startup is non-deterministic, every replica re-downloads
                          on every restart, and it is subject to upstream availability and rate
                          limits.
                        properties:
                          file:
                            description: |-
                              File is the specific file to fetch, e.g. "Qwen3-0.6B-Q4_K_M.gguf".
                              Required for GGUF engines; omit for engines that consume a whole repo.
                            type: string
                          repo:
                            description: Repo is the Hub repository, e.g. "unsloth/Qwen3-0.6B-GGUF".
                            pattern: ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$
                            type: string
                          tokenSecretRef:
                            description: TokenSecretRef references a Hugging Face
                              token for gated repositories.
                            properties:
                              key:
                                description: The key of the secret to select from.  Must
                                  be a valid secret key.
                                type: string
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                              optional:
                                description: Specify whether the Secret or its key
                                  must be defined
                                type: boolean
                            required:
                            - key
                            type: object
                            x-kubernetes-map-type: atomic
                        required:
                        - repo
                        type: object
                      image:
                        description: |-
                          Image mounts model weights from an OCI image.

                          This is the recommended source: it is deterministic, layer-cached by the
                          container runtime, works fully offline, and decouples the model's version
                          from the engine's — which is what allows a model change and an engine
                          change to be rolled out independently.
                        properties:
                          image:
                            description: Image is the OCI reference containing the
                              model file.
                            minLength: 1
                            type: string
                          path:
                            default: /weights/model.gguf
                            description: |-
                              Path is the absolute path to the model file inside that image.

                              This is where the file lives in the MODEL image, which is a different
                              place from where the engine will read it: the operator copies it onto a
                              shared volume and mounts that at a fixed location. The default matches
                              the convention used by this project's own Dockerfile.model.
                            pattern: ^/.*
                            type: string
                          pullPolicy:
                            default: IfNotPresent
                            description: PullPolicy for the model image.
                            enum:
                            - Always
                            - IfNotPresent
                            - Never
                            type: string
                        required:
                        - image
                        type: object
                      persistentVolumeClaim:
                        description: |-
                          PersistentVolumeClaim mounts weights from an existing PVC.
                          Not implemented yet.
                        properties:
                          claimName:
                            description: ClaimName is the PVC to mount.
                            minLength: 1
                            type: string
                          path:
                            description: Path is the absolute path to the model file
                              within the volume.
                            pattern: ^/.*
                            type: string
                          readOnly:
                            default: true
                            description: ReadOnly mounts the volume read-only.
                            type: boolean
                        required:
                        - claimName
                        - path
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of image, huggingFace or persistentVolumeClaim
                        must be set
                      rule: '[has(self.image), has(self.huggingFace), has(self.persistentVolumeClaim)].filter(x,
                        x).size() == 1'
                required:
                - name
                - source
                type: object
              observability:
                description: |-
                  Observability configures what the operator publishes for Prometheus and
                  Grafana to consume.
                properties:
                  prometheusRule:
                    description: |-
                      PrometheusRule configures the recording rules and burn-rate alerts the
                      controller creates.
                    properties:
                      enabled:
                        default: true
                        description: Enabled creates the PrometheusRule. Defaults
                          to true.
                        type: boolean
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          Labels are added to the PrometheusRule's metadata, for a Prometheus whose
                          ruleSelector is not empty. Same escape hatch, and same silent failure
                          mode, as ServiceMonitorSpec.Labels.
                        type: object
                      longWindowAlerts:
                        default: false
                        description: |-
                          LongWindowAlerts emits the slow-burn tier as well: 3x over 1d and 1x over
                          3d, the two rungs of the Google SRE ladder that catch a budget being
                          consumed steadily rather than suddenly.

                          Off by default, and the reason is honesty rather than laziness. A demo
                          cluster is minutes old, so a 3d window has no data and every panel and
                          alert built on it shows "No Data" — which looks worse than not having
                          them and trains a viewer to ignore the alert list. Being explicit that
                          the SLO window is compressed for the demo is more credible than shipping
                          rules that cannot evaluate.

                          Turn this on for a real deployment, where the windows mean what they say.
                        type: boolean
                    type: object
                  serviceMonitor:
                    description: |-
                      ServiceMonitor configures the prometheus-operator ServiceMonitor the
                      controller creates for this ModelDeployment.

                      If the prometheus-operator CRDs are not installed in the cluster, no
                      ServiceMonitor is created and the MetricsRegistered condition explains
                      why. That is reported as a fact, not an error: a cluster without
                      Prometheus is a legitimate configuration, and failing the reconcile over
                      it would make the whole resource unusable.
                    properties:
                      enabled:
                        default: true
                        description: Enabled creates the ServiceMonitor. Defaults
                          to true.
                        type: boolean
                      interval:
                        default: 15s
                        description: |-
                          Interval is the scrape interval.

                          The default is deliberately tighter than Prometheus's own 30s default.
                          Canary analysis evaluates a rate() over a short window — 60s by
                          measurement — and a rate over a window holding two samples is not a rate,
                          it is a difference between two points with no way to tell a trend from a
                          blip. 15s puts four samples in that window.
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          Labels are added to the ServiceMonitor's metadata.

                          This is the escape hatch for a Prometheus whose serviceMonitorSelector is
                          not empty: prometheus-operator only picks up ServiceMonitors matching
                          that selector, and the failure mode when it does not match is total
                          silence — no error, no event, simply no metrics. Setting the label the
                          local Prometheus selects on is how a user fixes that without patching the
                          operator.
                        type: object
                      scrapeEngineMetrics:
                        default: true
                        description: |-
                          ScrapeEngineMetrics also scrapes the inference engine's own metrics
                          endpoint, in addition to the shim's. Defaults to true.

                          The two are not interchangeable and neither replaces the other. The
                          shim's llmcp_* metrics are the canonical SLIs: they mean the same thing
                          under any engine, and they are what analysis and alerting consume. The
                          engine's native metrics are DIAGNOSTICS — KV-cache occupancy, slot
                          counts, tokens per second as the engine itself counts them — which are
                          invaluable when a human is debugging why a canary failed and useless as
                          something to gate a promotion on, because their names and semantics
                          change with the engine.
                        type: boolean
                      scrapeTimeout:
                        default: 10s
                        description: |-
                          ScrapeTimeout bounds a single scrape. It must not exceed Interval;
                          Prometheus rejects a ServiceMonitor where it does.
                        type: string
