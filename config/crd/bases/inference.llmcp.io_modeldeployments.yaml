                      stable revision still differ, and the state machine would dutifully start
                      again — producing an infinite loop of identical failing rollouts, each
                      one costing a full analysis window and a Deployment churn.

                      Recording the rejection makes a rollback STICK until a human changes the
                      spec, which is exactly the semantics people expect from one.
                    type: string
                  lastAnalysisTime:
                    description: |-
                      LastAnalysisTime is when the last round ran. It is what the interval is
                      measured from.
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable summary of the current
                      state.
                    type: string
                  metricScopeReady:
                    description: |-
                      MetricScopeReady reports whether the controller has observed a complete
                      analysis window from shims carrying this ModelDeployment's namespace and
                      name labels. Automatic analysis holds while this is false so metrics from
                      another resource, or from a pinned legacy shim, cannot drive the rollout.
                    type: boolean
                  observationReason:
                    description: |-
                      ObservationReason explains whether the measurement is available. An
                      unknown observation does not spend any rollout failure or error budget.
                    type: string
                  observationWindow:
                    description: ObservationWindow is the lookback used for the request-start
                      rates.
                    type: string
                  observedAt:
                    description: |-
                      ObservedAt is the shared Prometheus evaluation timestamp of the last
                      observation attempt, including attempts that yielded an unknown weight.
                    format: date-time
                    type: string
                  observedWeight:
                    description: |-
                      ObservedWeight is the rounded percentage of inference requests started at
                      canary shims over ObservationWindow. It is absent when evidence is missing,
                      stale or below the traffic floor. It never drives rollout decisions.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  readinessTarget:
                    description: |-
                      ReadinessTarget binds AvailableSince to the current rung, capacity and
                      candidate Deployment. A change requires fresh warm-up and evidence.
                    properties:
                      canaryReplicas:
                        description: CanaryReplicas is the complete candidate capacity
                          required to be ready.
                        format: int32
                        type: integer
                      deploymentUID:
                        description: DeploymentUID distinguishes a deleted and recreated
                          Deployment.
                        type: string
                      generation:
                        description: Generation is the candidate Deployment generation
                          being observed.
                        format: int64
                        type: integer
                      step:
                        description: Step is the rung index associated with this readiness
                          observation.
                        format: int32
                        type: integer
                      totalReplicas:
                        description: TotalReplicas is the fleet capacity used to compute
                          this rung.
                        format: int32
                        type: integer
                      weight:
                        description: Weight is the requested configured share for
                          this rung.
                        format: int32
                        type: integer
                    required:
                    - canaryReplicas
                    - deploymentUID
                    - generation
                    - step
                    - totalReplicas
                    - weight
                    type: object
                  readyReplicas:
                    description: |-
                      ReadyReplicas is the observed ready candidate count, distinct from the
                      desired count in ReadinessTarget. Old-generation pods do not satisfy the gate.
                    format: int32
                    type: integer
                  revision:
                    description: Revision is the revision hash under evaluation.
                    type: string
                  stableRevision:
                    description: StableRevision is what a rollback would revert to.
                    type: string
                  startTime:
                    description: StartTime is when this canary began.
                    format: date-time
                    type: string
                  step:
                    description: Step is the zero-based index into the weight ladder.
                    format: int32
                    type: integer
                  steps:
                    description: Steps is how many steps the ladder has.
                    format: int32
                    type: integer
                type: object
              conditions:
                description: Conditions follow the standard Kubernetes condition contract.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the in-cluster OpenAI-compatible base URL.
                type: string
              lastGoodRevision:
                description: |-
                  LastGoodRevision is the most recent revision that reached availability.
                  It is the target an automatic rollback reverts to.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation this status reflects.
                  Anything asking "is the rollout finished?" must compare this against
                  .metadata.generation first, or it will read a stale answer.
                format: int64
                type: integer
              phase:
                description: Phase is a coarse summary for humans and printer columns.
                enum:
                - Pending
                - Progressing
                - Available
                - Canarying
                - Promoting
                - RollingBack
                - Paused
                - Degraded
                type: string
              readyReplicas:
                description: ReadyReplicas is the number of pods passing their readiness
                  probe.
                format: int32
                type: integer
              replicas:
                description: |-
                  Replicas is the TOTAL actual pod count across all variants.

                  Part of the /scale subresource contract. An HPA divides by this number,
                  so an inaccurate value does not merely look wrong, it makes the
                  autoscaler compute the wrong target.
                format: int32
                type: integer
              selector:
                description: |-
                  Selector is a SERIALIZED label selector string (e.g.
                  "llmcp.io/model-deployment=demo"), not a metav1.LabelSelector.

                  Part of the /scale subresource contract: an HPA uses it to find the pods
                  whose metrics it averages. It must select every variant, so that scaling
                  decisions are made over the whole fleet rather than half of it.
                type: string
              stableRevision:
                description: StableRevision is the revision hash currently serving
                  as primary.
                type: string
              updatedReplicas:
                description: UpdatedReplicas is the number of pods running the target
                  revision.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
