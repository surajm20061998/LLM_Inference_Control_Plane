name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  chainsaw:
    permissions:
      contents: read
    name: Chainsaw on kind
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create the cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.14.0
        with:
          # PINNED, both of them. The action's defaults track whatever it
          # shipped with, which drifts from what this project is developed and
          # tested against — and a Kubernetes minor version difference is
          # exactly where CEL behaviour, native sidecar semantics and /scale
          # handling change underneath you.
          version: v0.33.0
          node_image: kindest/node:v1.35.8
          cluster_name: llmcp-e2e
          config: hack/kind-config.yaml

      - name: Build and load the images
        run: |
          set -euo pipefail
          # Built and side-loaded rather than pushed to a registry: CI has no
          # long-lived registry to be incremental against, so the layer-caching
          # argument that motivates one locally does not apply here.
          make docker-build IMG=llmcp-controller:ci
          docker build -f Dockerfile.shim -t llmcp-shim:ci .
          docker build -f Dockerfile.fakeengine -t llmcp-fakeengine:ci .
          docker build -f Dockerfile.loadgen -t llmcp-loadgen:ci .

          # A placeholder model image. Every CI suite runs against the
          # deterministic stub engine, which never reads the weights — a real
          # 400 MB model would add minutes to every run for no signal.
          rm -rf .build/model && mkdir -p .build/model
          echo "llmcp ci placeholder" > .build/model/model.gguf
          docker build -f Dockerfile.model -t llmcp-model:ci .build/model

          for img in llmcp-controller llmcp-shim llmcp-fakeengine llmcp-loadgen llmcp-model; do
            kind load docker-image "${img}:ci" --name llmcp-e2e
          done

      - name: Deploy the operator
        run: |
          set -euo pipefail
          make install
          cd config/manager && ../../bin/kustomize edit set image controller=llmcp-controller:ci && cd -
          ./bin/kustomize build config/default \
            | sed -e 's#localhost:5001/llmcp-shim:dev#llmcp-shim:ci#' \
            | kubectl apply -f -
          kubectl -n llmcp-system rollout status deploy/llmcp-controller-manager --timeout=180s

      - name: Run the suites that need no monitoring stack
        run: |
          set -euo pipefail
          # 03 and 04 are excluded here: they need Prometheus to have scraped the
          # shim before analysis can reach a verdict, and standing up
          # kube-prometheus-stack costs more CI minutes than the signal is worth
          # on every push. They run in the scheduled job below instead.
          for suite in 01-basic 02-rolling-update 05-scale-subresource 06-external-hpa; do
            make e2e-chainsaw SUITE="${suite}"
          done
        env:
          # The suites reference these tags rather than the local registry.
          LLMCP_E2E: "1"

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n llmcp-system logs deploy/llmcp-controller-manager --tail=300 || true
          kubectl get modeldeployments -A -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
