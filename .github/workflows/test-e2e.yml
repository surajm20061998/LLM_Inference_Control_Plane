name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  chainsaw:
    permissions:
      contents: read
    name: Chainsaw on kind
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Pinned, and installed directly rather than through helm/kind-action.
      #
      # The action would create the cluster for us, but this project's cluster
      # comes with a local registry attached (hack/kind-with-registry.sh), and
      # the registry is not a convenience — every sample and every Chainsaw
      # fixture references localhost:5001. Letting CI create the cluster a
      # different way means CI tests a deployment path no human ever uses.
      - name: Install kind
        run: |
          set -euo pipefail
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # `make kind-up` runs the same script a developer runs: registry on
      # localhost:5001, a 3-node cluster on a pinned node image, and containerd
      # on every node taught where that registry actually lives.
      - name: Create the cluster and registry
        run: make kind-up

      # `make dev-deploy` is the documented local workflow: build every image,
      # push it to the registry, install the CRDs, and apply config/dev — which
      # is where the --shim-image argument lives. Reproducing that by hand in CI
      # is how the first attempt at this job ended up deploying a controller
      # that injected an image nobody had built.
      - name: Build, push and deploy
        run: make dev-deploy

      - name: Run the suites that need no monitoring stack
        run: |
          set -euo pipefail
          # 03 and 04 are excluded: they need Prometheus to have scraped the
          # shim before analysis can reach a verdict, and standing up
          # kube-prometheus-stack costs more CI time than the signal is worth on
          # every push. They run in the scheduled job instead.
          for suite in 01-basic 02-rolling-update 05-scale-subresource 06-external-hpa; do
            echo "::group::${suite}"
            make e2e-chainsaw SUITE="${suite}"
            echo "::endgroup::"
          done

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n llmcp-system logs deploy/llmcp-controller-manager --tail=300 || true
          kubectl get modeldeployments -A -o yaml || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
