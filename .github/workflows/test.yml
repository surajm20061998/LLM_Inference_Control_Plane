name: Tests

on:
  push:
  pull_request:

permissions: {}

# One run per ref, and supersede rather than queue.
#
# Without this every same-repo pull request runs each workflow TWICE — once for
# the push to the branch, once for the pull_request event — and pushing a fixup
# leaves the run for the previous commit burning a runner to report on code
# nobody is looking at any more. test-e2e.yml alone has timeout-minutes: 40.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    permissions:
      contents: read
    name: Unit and envtest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The tool binaries under bin/ are `go install`ed from source. Nothing
      # else caches them: setup-go caches the module and build caches, which
      # makes the rebuild cheaper but does not skip it. The worst instance is
      # chainsaw, a ~229 MB binary compiled on every push purely to schema-check
      # the suite definitions in about a second. Every tool version literal lives in
      # the Makefile, so it is the right cache key.
      - name: Cache tool binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', '.custom-gcl.yml') }}
          restore-keys: |
            tools-${{ runner.os }}-

      # Runs BEFORE the tests. The suites cannot RUN here — they need a cluster,
      # and that is the e2e job's problem. But they can be validated against
      # Chainsaw's own schema, which catches a misspelled field or a misplaced
      # block in about a second, and there is no reason to spend the envtest
      # run's minutes first only to fail on a typo.
      - name: Validate the Chainsaw suites
        run: make chainsaw-lint

      # GitHub renders Mermaid directly from README.md. Render every fenced
      # diagram with the exact parser version pinned in the Makefile so a
      # syntax regression is caught before the repository page is published.
      - name: Validate README diagrams
        run: make docs-mermaid-check

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn

  generated:
    permissions:
      contents: read
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The CRD, the RBAC role, the deepcopy functions and the API reference are
      # all generated from Go markers and comments. A pull request that changes
      # a type without regenerating them produces a repository whose manifests
      # do not match its code — and the mismatch surfaces as a confusing
      # validation error in someone else's cluster.
      - name: Regenerate everything
        run: make manifests generate api-docs

      - name: Fail if anything changed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'make manifests generate api-docs' and commit the result."
            git --no-pager diff --stat
            git --no-pager diff | head -200
            exit 1
          fi
