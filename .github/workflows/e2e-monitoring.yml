# Prometheus-backed rollout/isolation suites plus a separate disposable-cluster
# job for optional monitoring API discovery and drift repair.
#
# Separate from the push-triggered e2e job on purpose. Standing up
# kube-prometheus-stack, driving load for several minutes and waiting for an
# analysis verdict is genuinely slow, and paying that on every push would push
# people towards skipping CI rather than towards fixing it.
#
# It runs nightly and on demand, which is the right cadence for a suite whose
# job is to catch integration drift rather than to gate a change.
name: E2E — Prometheus and observability resync

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    permissions:
      contents: read
    name: Canary promote and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install kind
        run: |
          set -euo pipefail
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create the cluster and registry
        run: make kind-up

      - name: Build, push and deploy
        run: |
          set -euo pipefail
          make dev-deploy
          # dev-images deliberately omits the load generator: it is not part of
          # the fast inner loop. The canary suites need it, because a canary with
          # no traffic is Inconclusive by design and would hold forever.
          make loadgen-image

      - name: Install kube-prometheus-stack
        run: make monitoring-install

      - name: Canary suites
        run: |
          set -euo pipefail
          make e2e-chainsaw SUITE=03-canary-promote
          make e2e-chainsaw SUITE=04-canary-rollback
          make e2e-chainsaw SUITE=07-metric-isolation
          make e2e-chainsaw SUITE=08-canary-ladder

      - name: Verify the anti-buffering exit criterion
        run: |
          set -euo pipefail

          # A TARGET OF ITS OWN, deliberately.
          #
          # The canary suites above run in Chainsaw's generated namespaces, and
          # test/chainsaw/config.yaml sets cleanup.skipDelete: false — so by the
          # time this step runs, their shim pods and their load Job have been
          # deleted and rate(...[2m]) is decaying toward zero. Measuring here
          # meant racing a window that was already closing, which is how a check
          # this important came to be written with `|| true` after it.
          kubectl apply -f config/samples/inference_v1alpha1_modeldeployment.yaml
          kubectl wait --for=condition=Ready modeldeployment/demo --timeout=5m

          # Backgrounded WITH its output redirected: a background process that
          # inherits the step's stdout pipe can keep the runner waiting on that
          # pipe after bash exits.
          kubectl -n monitoring port-forward \
            svc/kps-kube-prometheus-stack-prometheus 9091:9090 >/dev/null 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT

          # Polled, not slept. `sleep 5` was a guess, and when it was wrong the
          # first curl inside ttft-ratio.sh aborted the script under `set -e`
          # with curl's exit 7 — which `|| true` then swallowed.
          for _ in $(seq 30); do
            curl -sf http://localhost:9091/-/ready >/dev/null && break
            sleep 1
          done

          # WAIT=false returns immediately; the Job keeps generating for its
          # full duration while ttft-ratio.sh waits for the series to appear.
          make load MD=demo WAIT=false

          # ttft_p95 < 0.5 x duration_p95. Every way of getting the shim wrong —
          # a missing FlushInterval, gzip on the upstream hop, timing the first
          # byte instead of the first token — collapses this ratio to 1.0.
          #
          # NOT `|| true`. hack/verify/ttft-ratio.sh exits non-zero precisely so
          # it can gate CI ("Exits non-zero when the criterion is not met, so it
          # can gate CI", its own header). Discarding that made the single most
          # valuable signal in this job decorative.
          make verify-ttft

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n llmcp-system logs deploy/llmcp-controller-manager --tail=300 || true
          kubectl get modeldeployments -A -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true

  observability-resync:
    permissions:
      contents: read
    name: Optional monitoring API resync
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install kind
        run: |
          set -euo pipefail
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create a disposable monitoring-free cluster
        run: make kind-up CLUSTER_NAME=llmcp-observability-resync

      - name: Build, push and deploy
        run: make dev-deploy

      - name: Exercise late install, drift repair and API removal
        run: make e2e-observability-resync

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl -n llmcp-system logs deploy/llmcp-controller-manager --tail=300 || true
          kubectl get modeldeployments -A -o yaml || true
          kubectl get crds servicemonitors.monitoring.coreos.com prometheusrules.monitoring.coreos.com -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
