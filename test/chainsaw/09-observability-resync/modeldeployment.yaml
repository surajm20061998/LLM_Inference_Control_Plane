apiVersion: inference.llmcp.io/v1alpha1
kind: ModelDeployment
metadata:
  name: resync-demo
spec:
  replicas: 1
  model:
    name: stub-model
    source:
      image:
        image: localhost:5001/llmcp-model:dev
        path: /weights/model.gguf
        pullPolicy: Always
  engine:
    type: llamacpp
    image: localhost:5001/llmcp-fakeengine:dev
    imagePullPolicy: Always
    contextSize: 4096
    maxConcurrency: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  serving:
    port: 8080
    startupTimeout: 60s
  observability:
    serviceMonitor:
      enabled: true
      interval: 5s
      scrapeTimeout: 3s
    prometheusRule:
      enabled: true
