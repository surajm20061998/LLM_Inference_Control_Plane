# The vertical slice, on a real cluster.
#
# Everything below is proven at the envtest tier already — except the part that
# matters most here: that the pods actually START, that the shim is injected as
# a native sidecar and becomes ready before the engine, and that a real HTTP
# request reaches a real streaming response through the Service.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: basic
spec:
  steps:
    - name: create
      try:
        - apply:
            file: modeldeployment.yaml
        - assert:
            resource:
              apiVersion: inference.llmcp.io/v1alpha1
              kind: ModelDeployment
              metadata:
                name: basic-demo
              status:
                phase: Available
                replicas: 2
                readyReplicas: 2
                # Looked up by JMESPath, not by position. Chainsaw compares arrays
                # element by element BY INDEX, and status.conditions[0] is SpecValid —
                # so a positional assertion here silently checks the wrong condition.
                #
                # The ENTIRE path lives inside the parentheses. Chainsaw only treats a
                # key as an expression when it both opens with "(" and closes with ")";
                # `(conditions[?type == 'Ready'])[0].status` is read as a literal field
                # name and fails with "field not found in the input object", which looks
                # exactly like the controller never set the condition. And `|` is what
                # closes the filter PROJECTION, so that [0] indexes the matched list
                # rather than each element of it.
                (conditions[?type == 'Ready'] | [0].status): "True"
                (conditions[?type == 'ModelReady'] | [0].status): "True"

    - name: the-shim-is-a-native-sidecar
      try:
        - assert:
            # restartPolicy: Always on an INIT container is what makes it a
            # native sidecar. Without it the kubelet waits for the shim to exit
            # before starting the engine — and since the shim is a server that
            # never exits, the pod hangs in Init forever. envtest cannot catch
            # that, because envtest never starts a pod.
            #
            # Selected by JMESPath rather than by position: initContainers[0] is
            # the model-init container, so a positional assertion would compare
            # the shim's expected fields against the wrong container and fail
            # for a reason that has nothing to do with sidecars.
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: basic-demo-primary
              spec:
                template:
                  spec:
                    (initContainers[?name == 'shim'] | [0].restartPolicy): Always
        - assert:
            # And the ORDER: weights are staged before anything starts serving
            # or measuring.
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: basic-demo-primary
              spec:
                template:
                  spec:
                    (initContainers[].name): [model-init, shim]

    - name: serves-a-streamed-completion
      try:
        - script:
            # bash, explicitly. Chainsaw defaults to `sh -c`, and on an Ubuntu runner
            # /bin/sh is dash — which does not support `set -o pipefail` and aborts the
            # whole step with "Illegal option". It works on macOS only because /bin/sh
            # there is bash in POSIX mode, which is exactly why this stayed invisible
            # locally.
            shell: bash
            content: |
              set -euo pipefail
              kubectl -n $NAMESPACE run curl-completion --rm -i --restart=Never \
                --image=curlimages/curl:8.11.1 --quiet -- \
                curl -sS --fail-with-body -m 60 \
                  -H 'Content-Type: application/json' \
                  -d '{"model":"stub-model","stream":true,"messages":[{"role":"user","content":"hi"}]}' \
                  http://basic-demo.$NAMESPACE.svc:8080/v1/chat/completions \
                | tee /dev/stderr | grep -q 'data: '

    - name: the-shim-is-in-the-path
      try:
        # If the Service targeted the engine directly, this endpoint would 404 —
        # and every llmcp_* metric would be missing while everything else looked
        # perfectly healthy.
        - script:
            shell: bash
            content: |
              set -euo pipefail
              kubectl -n $NAMESPACE run curl-livez --rm -i --restart=Never \
                --image=curlimages/curl:8.11.1 --quiet -- \
                curl -sS --fail-with-body -m 30 \
                  http://basic-demo.$NAMESPACE.svc:8080/llmcp/livez \
                | grep -q ok

    - name: metrics-are-exposed-on-the-metrics-port
      try:
        - script:
            shell: bash
            content: |
              set -euo pipefail
              # Addressed by POD IP, not by a pod-name DNS record.
              #
              # A headless Service only publishes per-pod DNS names of the form
              # <hostname>.<service>.<ns>.svc when the pods set spec.hostname and
              # spec.subdomain — which StatefulSet does automatically and a
              # Deployment does not. For Deployment pods the addressable records
              # are the Service name (returning every pod IP) and the IP itself.
              ip=$(kubectl -n $NAMESPACE get pods -l llmcp.io/model-deployment=basic-demo \
                -o jsonpath='{.items[0].status.podIP}')
              echo "shim metrics at ${ip}:9090"
              kubectl -n $NAMESPACE run curl-metrics --rm -i --restart=Never \
                --image=curlimages/curl:8.11.1 --quiet -- \
                curl -sS --fail-with-body -m 30 "http://${ip}:9090/metrics" \
                | grep -q llmcp_inference_requests_total

        - assert:
            # The headless metrics Service exists and has endpoints, which is
            # what the ServiceMonitor selects on. Separate from the scrape above
            # because they fail for different reasons.
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: basic-demo-metrics
              spec:
                clusterIP: None

    - name: deleting-garbage-collects-every-child
      try:
        # The whole no-finalizer story: every child is ownerRef'd, so deleting
        # the parent is enough. A finalizer that is not strictly required is a
        # liability, because a bug in its removal path wedges deletion
        # permanently — during your own demo.
        - delete:
            ref:
              apiVersion: inference.llmcp.io/v1alpha1
              kind: ModelDeployment
              name: basic-demo
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: basic-demo-primary
        - error:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: basic-demo
