# A MINIMAL ServiceMonitor CRD, for envtest only.
#
# This is not prometheus-operator's real CRD and must never be applied to a
# cluster. It exists so the operator's ServiceMonitor path can be exercised
# against a real API server without vendoring a 1 MB upstream schema and its Go
# module into a project that writes exactly one kind from it.
#
# spec is x-kubernetes-preserve-unknown-fields, so the API server stores
# whatever the controller sends without validating its shape. That is the right
# trade for these tests: they assert on what the OPERATOR produced, and pinning
# a copy of upstream's schema here would mean the tests start failing when
# prometheus-operator adds a field, for reasons that have nothing to do with
# this code.
#
# The suite deliberately runs both with and without this file present, because
# "the CRD is absent" is a supported configuration that must not crash or fail a
# reconcile — see the MetricsRegistered condition.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicemonitors.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  scope: Namespaced
  names:
    kind: ServiceMonitor
    listKind: ServiceMonitorList
    plural: servicemonitors
    singular: servicemonitor
    shortNames:
      - smon
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
